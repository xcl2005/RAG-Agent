name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Unit tests
        run: pytest -m "not integration" --cov=rag_agent --cov-report=term-missing --cov-report=xml
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: "22"
      - name: Web behavior tests
        if: matrix.python-version == '3.12'
        run: node --test tests/web_ui_helpers.test.cjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build application image
        run: docker build -t rag-agent:ci .
      - name: Smoke-test application image
        run: |
          docker run --detach --name rag-agent-ci -e API_HOST=0.0.0.0 -p 18000:8000 rag-agent:ci
          trap 'docker rm --force rag-agent-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs rag-agent-ci
          exit 1
