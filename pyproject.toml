[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-agent"
version = "1.0.0"
description = "Production-minded adaptive RAG agent with LangGraph, hybrid retrieval, MCP and grounded-answer evaluation."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "xcl2005" }]
keywords = ["rag", "agent", "langgraph", "mcp", "qdrant", "fastapi"]
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.140,<1",
    "langgraph>=1.2.9,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "lxml>=5.4,<7",
    "numpy>=2.0,<3",
    "openai>=2.48,<3",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.10,<3",
    "pypdf>=5.7,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.18,<2",
    "sentence-transformers>=5.6.1,<6",
    "tqdm>=4.67,<5",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    # Starlette 1.x prefers the successor test transport and warns when it has
    # to fall back to legacy httpx.
    "httpx2>=2.9,<3",
    "mypy>=1.16,<2",
    "pytest>=9.1,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.16,<1",
]
mcp = [
    # Keep the tested v1 contract explicit; evaluate a major migration in CI
    # before changing the adapter, rather than relying on release predictions.
    "mcp[cli]>=1.28,<2",
]

[project.scripts]
rag-agent-api = "rag_agent.api.main:run"
rag-agent-mcp = "rag_agent.mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.hatch.build.targets.sdist]
include = [
    ".env.example",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "data/eval/sample_retrieval.jsonl",
    "data/eval/portfolio",
    "docs",
    "scripts",
    "src/rag_agent",
    "tests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires external services or downloadable ML models",
]

[tool.coverage.run]
source = ["rag_agent"]
omit = ["src/rag_agent/web/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001/2/3 flag full-width punctuation as "ambiguous". Chinese prose and
# prompts intentionally use those characters, so enabling these checks would
# make readable Chinese documentation fail CI.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
# Type-check on 3.12: current NumPy stubs use syntax unavailable to mypy's
# 3.10 parser, while runtime compatibility is still exercised on Python 3.10.
python_version = "3.12"
packages = ["rag_agent"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["src/rag_agent/web"]
